name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      dependency_bundle:
        description: 'Export compiled Linux dependencies for the matching local toolchain'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Elan
        run: |
          curl --fail --location --silent --show-error https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz --output /tmp/elan.tar.gz
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake
          key: lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Obtain the pinned dependency cache
        run: bash scripts/fetch-cache.sh
      - name: Build and audit proof dependencies
        run: python3 scripts/verify.py
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: ${{ !cancelled() }}
        with:
          path: .lake
          key: lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
      - name: Preserve verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: lean-verification
          path: |
            verification/*.log
            verification/publication-check.json
          if-no-files-found: ignore
      - name: Bundle compiled dependencies for local use
        if: ${{ !cancelled() && inputs.dependency_bundle }}
        run: |
          find .lake/packages -mindepth 3 -maxdepth 3 -path '*/.lake/build' -type d -print > /tmp/lean-build-paths.txt
          tar --zstd -cf /tmp/lean-dependencies.tar.zst -T /tmp/lean-build-paths.txt
      - name: Preserve the optional dependency bundle
        if: ${{ !cancelled() && inputs.dependency_bundle }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-lean-dependencies
          path: /tmp/lean-dependencies.tar.zst
          compression-level: 0
          retention-days: 3
